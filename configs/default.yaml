# =============================================================================
# SPARTA v2.0 默认配置
# =============================================================================
# 纪律：所有阈值与参数写在这里，代码里禁止硬编码。
# 每次出图时，请把实际使用的这份 yaml 复制到 results/ 对应目录，与图件同存。
#
# 参数分三类，处理方式完全不同：
#   [物理锚定]  有文献值，直接固定，不参与任何拟合。改动它等于改变物理假设。
#   [无监督标定] 用"同瘤种不同切片间屏障分布一致性"标定，全程不接触临床标签。
#   [敏感性]    必须做网格扫描，在补充材料中给出结论随参数变化的热图。
#
# 信息泄漏红线：任何用了临床响应标签的参数调整，都会使临床验证失去意义。
# =============================================================================

seed: 0

paths:
  root: "."                 # 项目根目录，相对或绝对路径均可
  raw: "data/raw"           # 原始下载，只读
  interim: "data/interim"   # 中间产物
  external: "data/external" # 基因集、临床队列
  results: "results"

# -----------------------------------------------------------------------------
# M1 质控
# -----------------------------------------------------------------------------
qc:
  min_counts: 500           # [敏感性] 每个 spot 的最小 UMI 数
  min_cells_per_gene: 3     # 基因至少在这么多 spot 中表达
  # 平台差异：Visium spot 中心间距 100 μm；第一代 ST 约 200 μm。
  # 这个值决定了后续所有"微米"单位的换算是否正确，务必按实际平台填写。
  spacing_um: 100.0

# 切片准入标准 C1–C7（详见技术方案书第 2.2 节）
# 队列级阈值放宽（overrides）：不同平台世代的数据质量差异是客观存在的，
# 但放宽必须**写在这里、注明日期与理由**，而不是靠命令行 --force 悄悄放行。
# run_01_qc.py 会读取 --cohort 对应的这一段，并把实际生效的阈值写进
# {slide}.admission.json，使准入过程可审计。
admission_overrides:
  cscc_legacy_gse144239:
    min_spots_legacy_st: 300  # 实测（2026-08-27 直接读 12 个选点文件）：整块阵列 1933–1934 点，
                              # 组织覆盖后 461–1181 点，12 张全部过线。原注释写的"1007 点"是错的。
    min_median_umi: 300       # 第一代 ST 化学法测序深度显著低于 Visium；摄入后务必核对实际值
                              # （CSCC05 实测每 spot 中位 5388 UMI，远高于本阈值）
    reason: "GSE144239 的 P2/P5/P9/P10 为第一代 ST 平台（1933 点交错阵列、最近邻 200 μm），深度与点数与 Visium 不可比"
    decided_on: "2026-08-27"

  cscc_gse144239:
    min_spots_visium: 500   # 2020 年早期 Visium，切片面积小；GSE144239 的 4 张为 652–3838 spot
    min_median_umi: 500     # 同一批次测序深度较浅（635–16686），按队列整体下调
    reason: "GSE144239 (Ji et al. 2020 Cell) 为早期 Visium 平台，spot 数与测序深度与 2024 年数据不可比"
    decided_on: "2026-08-26"

  # GSE250636（MEL01–04）队列级豁免登记。
  # 背景：原始建库时 `_pipeline_3samples.py` 对 MEL 切片带 --force 放行
  # （见 docs/review_for_journal.md §R8），当时 --force 分支不写 admission.json。
  # 2026-08-26 起用 run_00c_admission_audit.py 回溯重建台账，
  # 2026-10-03 审查后在此正式登记队列级豁免，使"保留这 4 张"成为可审计的规则而非静默放行。
  # 注意：本段**不含任何阈值键**，因此 check_admission 不会放宽 C4/C5 的默认阈值——
  # MEL02（840 spots < 1000）与 MEL04（中位 1488 UMI < 1500）的未通过项照实记录，
  # 与本队列一并按同一决定保留。C7（治疗状态）是布尔准入项，无法用阈值覆盖，
  # 豁免 = 登记决定 + 在稿件 Limitations 披露局限。
  mel_gse250636:
    reason: "GSE250636 为 2024 年 Visium 的黑色素瘤颅外转移灶切片（MEL_PtA 与 MEL_PtB 两患者，共 4 片；
             MEL01/MEL04 属患者 A，MEL02/MEL03 属患者 B）。
             队列级豁免：C7 治疗状态在 GEO 无标注，按队列登记豁免并保留在分析中，
             局限已写入稿件 Limitations（治疗状态未知，屏障结构可能已改变）。
             MEL02（840 spots < 默认 1000）与 MEL04（中位 1488 UMI < 默认 1500）
             同时未过 C4/C5 默认阈值，按同一队列级决定保留；
             逐片记录见 data/admission_audit.csv。"
    decided_on: "2026-08-26（回溯登记）；2026-10-03 审查后正式对账"

  # 10x Genomics 公开 Visium 人乳腺癌数据（外部独立验证队列，2026-10-03 补强登记）。
  # 背景：主队列为 GSE144239（cSCC）与 GSE250636（黑色素瘤）。为给"双屏障耦合"
  # 提供跨数据集、跨肿瘤类型的独立复现，接入 10x 公开 Visium 人乳腺癌
  # （V1_Breast_Cancer_Block_A_Section_1/2，同一患者的两张相邻切片，1.1.0 spaceranger）。
  # 注意：Block C 的两张切片未纳入（初始计划 4 张 2 患者，实际只跑了 Block A 2 张 1 患者）。
  # C7（治疗状态）在 10x 公开页面未标注，按队列豁免登记并保留，局限同 MEL 处理。
  # 2026-10-03 审查：run_batch 曾把 cancer_type=other 静默回退到 melanoma，导致这两张
  # 切片用黑色素瘤标记打 Malignant_n（MLANA/PMEL/TYR...）。R3 逐点场相关不依赖 sink，
  # rho_partial 结果有效；但 B_cell 标量与 S1/S2 反事实依赖 sink，已在 manuscript
  # 中降级为探索性。如需正式外部验证，应以 brca 类型重跑 run_02-05。
  brca_10x_vis:
    min_spots_visium: 500
    min_median_umi: 500
    reason: "10x Genomics 公开 Visium 人乳腺癌 Block A Section 1/2（同一患者 2 张相邻切片）。
             外部独立验证：治疗状态公开页面未标注，按队列豁免登记 C7；早期 Visium 化学，
             阈值套用 cscc_gse144239 的 500/500。仅 1 位患者 2 张切片，不是独立肿瘤重复。"
    decided_on: "2026-10-03（外部独立验证补强登记；2026-10-03 审查后修正为 Block A 2 张 1 患者）"

  # 10x 公开 Visium 人淋巴结（外部独立验证第二样本，2026-10-03）。
  # 与 brca_10x_vis 同一 1.1.0 spaceranger 输出、同一公开数据批次；
  # 治疗状态未标注 → C7 按队列豁免登记；阈值套用 500/500。
  ln_10x_vis:
    min_spots_visium: 500
    min_median_umi: 500
    reason: "10x Genomics 公开 Visium 人淋巴结切片（1.1.0 spaceranger 输出）。
             外部独立验证第二样本：治疗状态公开页面未标注，按队列豁免登记 C7；
             早期 Visium 化学，阈值套用 cscc_gse144239 的 500/500。"
    decided_on: "2026-10-03（外部独立验证补强登记）"

  # Thrane et al. 2018 黑色素瘤淋巴结转移灶（独立复现队列，2026-10-05 登记，任何屏障/关联计算之前）。
  # 2016 年第一代 ST 阵列只有 1,007 个点（主队列 GSE144239 用的是 1,933 点阵列），
  # 原文报告平均每张切片 286 个组织点，因此 C4 的点数阈值按平台降到 200。
  # C3（无配对 H&E）与 C7（取样前治疗状态未报告）按队列豁免登记；两者都不进入任何计算。
  # 该队列单独成族报告，绝不并入主队列的数字。
  mel_thrane2018:
    min_spots_legacy_st: 200
    waived_criteria: ["C3", "C7"]
    reason: "Thrane et al. 2018 Cancer Res 78:5970（4 位 III 期黑色素瘤患者淋巴结转移灶，各 2 张连续切片）。
             1,007 点的 2016 年 ST 阵列，组织覆盖 212–383 点；点数阈值按平台降为 200。
             公开计数表不含配对 H&E（C3），原文未报告取样前治疗（C7），按队列豁免并在稿件中披露。"
    decided_on: "2026-10-05（复现队列登记；在计算任何图、屏障或关联之前）"

admission:
  min_spots_visium: 1000    # Visium 平台的最小 spot 数
  min_spots_legacy_st: 300  # 第一代 ST 平台的最小 spot 数
  min_median_umi: 1500      # [敏感性] 中位每 spot UMI
  min_endothelial_spots: 20 # C6：可识别内皮信号的最少 spot 数。
                            # 这是最易忽略也最致命的一条——不合格则 B_mAb 与
                            # B_meta 都算不出来，务必在建库阶段就查

# -----------------------------------------------------------------------------
# M2 签名打分
# -----------------------------------------------------------------------------
signatures:
  tumor_type: "melanoma"    # melanoma / cscc / bcc
  min_genes_matched: 2      # 匹配基因少于此数则跳过该签名并告警。
                            # 注意：Ag_target 只有 2 个基因（CD274/PDCD1LG2），
                            # 阈值设为 3 会导致该签名永远被跳过。
  ctrl_size: 50             # sc.tl.score_genes 的对照基因集大小
  hypoxia_gmt: "data/external/h.all.v7.1.HALLMARK_HYPOXIA.symbols.gmt"
                            # MSigDB HALLMARK_HYPOXIA（200 基因，v7.1，2026-08 已下载并用于全部 8 张切片）。
                            # 用法：run_02_score.py --hypoxia-gmt 指向该文件

# -----------------------------------------------------------------------------
# M3 空间图与源汇
# -----------------------------------------------------------------------------
graph:
  method: "radius"          # radius / knn
  radius_um: 150.0          # [敏感性] Visium 取 150；第一代 ST 取 250–300。
                            # 这个参数直接决定图的连通性，进而决定所有屏障值
  knn_k: 6                  # method=knn 时使用

source_sink:
  q_vessel: 0.80            # [敏感性] 内皮分数分位阈值 -> 血管节点
  q_immune_nbr: 0.60        # [敏感性] 血管节点中邻域 T 细胞分数的分位阈值 -> 源
  q_malig: 0.70             # [敏感性] 恶性分数分位阈值
  q_core: 0.50              # [敏感性] 恶性节点中距非肿瘤区图距离的分位阈值 -> 汇
  # 以上四个阈值必须做网格扫描（建议各自 0.6–0.9），证明结论稳定。
  # 这张热图是补充材料的必备一图。
  use_border_fallback: true # 内皮信号不足时，改用组织最外圈作为血管代理源。
                            # 一旦启用，必须在论文方法部分明确写出这一替代及其局限

# -----------------------------------------------------------------------------
# M4 三分量屏障算子
# -----------------------------------------------------------------------------
barrier:
  b_cell:
    a: 3.0                  # [无监督标定] 基线通径（截距）
    b_ecm: 8.0              # [无监督标定] ECM 对细胞通过的抑制系数
    c_caf: 4.0              # [无监督标定] CAF 对细胞通过的抑制系数

  b_mab:
    r_nm: 5.5               # [物理锚定] IgG 流体力学半径（纳米）。
                            # 文献值，不参与拟合。ADC 同为约 150 kDa，取值相同
    g0: 1.0                 # [无监督标定] 基线电导
    lam: 3.0                # [无监督标定] ECM 对电导的指数衰减系数
    # ---- 以下两个参数的身份已于 2026-08-26 审查后下调，理由必须写进 Methods ----
    # crosslink 输入是**片内秩标准化**到 [0,1] 的无量纲量，而 xi=xi0*exp(-beta*x)
    # 是有纳米单位的物理式。两者拼在一起的后果：每张切片的网孔范围都被强制成
    # [xi0*e^-beta, xi0] = [1.0, 20] nm，与该切片真实交联水平无关；
    # 完全排阻的阈值恒定落在秩 ln(xi0/r)/beta = 0.430，
    # 即任何切片都有约 55–60% 的边被排阻。因此它们不是物理锚定量，
    # 而是决定"排阻有多陡"的定性尺度参数。不要再宣称它们由文献锚定。
    xi0_nm: 20.0            # [定性尺度参数] 秩=0 处的名义网孔尺寸（纳米）
    beta: 3.0               # [定性尺度参数] 交联秩 -> 网孔收缩的陡峭度。
                            # 注意：交联对 B_mAb 变异的贡献几乎只是 beta 的单调函数
                            # （lam=3 列：beta=0.25 -> 0.2%；beta=1.5 -> 56.6%；
                            #  beta=3 -> 97.7%），所以"交联主导"不是数据结论。
    kd_eff: 0.5             # [敏感性] 有效解离常数，控制结合位点消耗强度
    kappa_w: 1.0            # [敏感性] 结合位点消耗项的权重
    g_floor: 1.0e-6         # 电导下限，防止图断开导致数值爆炸

  b_meta:
    spacing_um: 100.0       # [兜底值] 2026-08-27 起 d_vessel_um 走**加权图距**：
                            # run_04 把 graph.npz 里以微米为权的 D 传进 compute_b_meta，
                            # 这一行只在拿不到 D 时才生效（合成图、老的单元测试）。
                            # 换掉跳数近似的理由：它的偏差随平台阵列几何**反号**——
                            # 实测 hops×spacing ÷ 直线距离，Visium 六方阵列 1.109（高估 11%），
                            # 第一代 ST 交错阵列 r=300 为 0.894（低估 11%）。
                            # d0_um=130 锚的是直线氧扩散极限，两个队列因此凭空差出约 22%，
                            # 而 R3b 比的正是队列差异。仍与 qc.spacing_um 保持一致，
                            # 别让兜底值自己也是错的。
    d0_um: 130.0            # [物理锚定] sigmoid 拐点，对应氧扩散极限（文献 100–150 μm）
    tau_um: 40.0            # [敏感性] sigmoid 陡峭度
    w_hyp: 1.0              # [敏感性] 缺氧项权重
    w_quiesc: 1.0           # [敏感性] 静止（低增殖）项权重
    w_efflux: 1.0           # [敏感性] 外排泵项权重

# -----------------------------------------------------------------------------
# M5 反事实实验
# -----------------------------------------------------------------------------
counterfactual:
  s1:
    n_perm: 500             # 置换次数。500 次可给到 0.002 的经验 p 分辨率。
                            # ⚠ 两个队列必须用同一个值：2026-08-26 审查发现
                            # CSCC 实际只跑了 150 次（p 下限 0.0066），
                            # 与 MEL 的 500 次不可比。重跑时统一用本值。
    modes: ["fixed", "follow"]   # 两种模式论文中都要报告
  s2:
    # k_frac 是真实切片的正式口径：移除的节点数 = 割集节点数 x 该比例。
    # 理由：真实切片的割集有 150–750 个节点，固定 k=3–12 只动了 0.5%–8%，
    # 测到的效应量会随割集变大而系统性衰减（见 docs/review_for_journal.md §3 B2）。
    k_frac: [0.05, 0.10, 0.20, 0.30]
    k_list: [3, 5, 8, 12]   # [已弃用] 绝对 k，仅供合成图与复现 2026-08-26 前的旧结果
    n_rand: 200             # 随机对照的重复次数
    low_q: 0.05             # 移除时把阻力分数降到这个分位水平
  s3:
    radii_nm: [0.5, 1.0, 2.0, 3.0, 4.0, 5.5, 7.0, 10.0]

# -----------------------------------------------------------------------------
# M6 验证
# -----------------------------------------------------------------------------
validate:
  he_patch_px: 64           # H&E 图像块边长（像素）。需按 scalefactors 换算——
                            # Visium 的 55 μm spot 在全片图上对应多少像素因样本而异
  decouple_q: 0.75          # 判定"屏障高"的分位阈值
  sensitivity_grid:         # 敏感性扫描网格（示例，可按需扩展）
    b_ecm: [4.0, 6.0, 8.0, 10.0]
    c_caf: [2.0, 4.0, 6.0]
    radius_um: [120.0, 150.0, 180.0]
    q_vessel: [0.70, 0.80, 0.90]
